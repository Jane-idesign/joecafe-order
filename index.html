<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#17a6cc" />
  <title>淺水灣小聚 · 夏天的尾巴我來了！</title>
  <meta name="description" content="淺水灣小聚訂餐：選餐、填寫點餐家庭、產生訂單小卡。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%2317a6cc'/%3E%3Ctext x='32' y='42' font-size='30' text-anchor='middle'%3E%F0%9F%8D%BD%EF%B8%8F%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=202609231655" />
</head>
<body>
  <header class="hero" id="hero">
    <div class="hero__bar">
      <button class="hero__back" id="backBtn" type="button" aria-label="返回" hidden>←</button>
    </div>
    <div class="hero__text">
      <span class="hero__store">淺水灣小聚</span>
      <h1 id="pageTitle">夏天的尾巴我來了！</h1>
    </div>
  </header>

  <main id="app" class="app sheet">
    <nav class="cattabs" id="catTabs" aria-label="餐點分類"></nav>
    <!-- 步驟 1：菜單 -->
    <section id="viewMenu" class="view view--menu"></section>

    <!-- 步驤 2：確認 -->
    <section id="viewReview" class="view view--review" hidden>
      <h2 class="section-title">你的餐點</h2>
      <div id="reviewList" class="review-list"></div>
      <div class="review-total">
        <span>總金額</span>
        <strong id="reviewTotal">$0</strong>
      </div>

      <form id="orderForm" class="order-form" novalidate>
        <label class="field">
          <span class="field__label">點餐家庭</span>
          <input id="familyInput" name="family" type="text" placeholder="例如，小妍家" autocomplete="off" maxlength="30" required />
          <span class="field__error" id="familyError" hidden>請填寫點餐家庭</span>
        </label>
        <p class="hint" id="sheetHint" hidden>⚠️ 尚未設定試算表連結，送出後只會產生小卡、不會寫入資料庫（設定方式見 README）。</p>
      </form>
    </section>

    <!-- 步驟 3：完成 -->
    <section id="viewDone" class="view view--done" hidden>
      <div class="done-head">
                <h2 class="section-title">收到你的訂餐</h2>
        <p class="done-sub">淺水灣我們不見不散～🩵</p>
        <p class="done-sub is-warn" id="doneWarn" hidden></p>
      </div>
      <figure class="card-wrap">
        <img id="cardImg" alt="訂單小卡" />
        <figcaption>手機可長按圖片儲存</figcaption>
      </figure>
      <div class="done-actions">
        <a id="downloadBtn" class="btn btn--primary" download="order.png">⬇ 下載小卡</a>
      </div>
    </section>
  </main>

  <!-- 底部主按鈕 -->
  <footer class="bottombar" id="bottomBar" hidden>
    <button class="bottombar__btn" id="primaryBtn" type="button">
      <span class="bottombar__count" id="primaryCount">0 項</span>
      <span class="bottombar__label" id="primaryLabel">下一步</span>
      <span class="bottombar__total" id="primaryTotal">$0</span>
    </button>
  </footer>

  <!-- 規格選擇彈窗 -->
  <div class="osheet" id="optSheet" hidden>
    <div class="osheet__mask" data-close="1"></div>
    <div class="osheet__panel" role="dialog" aria-modal="true" aria-labelledby="optName">
      <div class="osheet__head">
        <button class="osheet__back" id="optBack" type="button" aria-label="返回" hidden>←</button>
        <div class="osheet__img" id="optImg"></div>
        <div class="osheet__title">
          <h3 id="optName"></h3>
          <span class="osheet__price" id="optPrice"></span>
        </div>
        <button class="osheet__close" type="button" data-close="1" aria-label="關閉">×</button>
      </div>
      <div class="osheet__toolbar" id="optToolbar" hidden></div>
      <div class="osheet__body">
        <div class="osheet__groups" id="optGroups"></div>
      </div>
      <div class="osheet__foot">
        <div class="osheet__qty">
          <button class="qty__btn" type="button" data-oq="-1" aria-label="減少">−</button>
          <span class="qty__num" id="optQty">1</span>
          <button class="qty__btn" type="button" data-oq="1" aria-label="增加">+</button>
        </div>
        <button class="osheet__add" type="button" id="optAdd">加入 <span id="optTotal"></span></button>
      </div>
    </div>
  </div>

  <canvas id="cardCanvas" hidden></canvas>

  <script src="js/config.js?v=202609231655"></script>
  <script src="js/menu.js?v=202609231655"></script>
  <script src="js/app.js?v=202609231655"></script>
</body>
</html>
